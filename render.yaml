# Render Blueprint for the GrabIt API server.
#
# How to deploy:
#   1. Push this whole repo to a GitHub repository.
#   2. In Render, click "New +" → "Blueprint" and select your repo.
#   3. Render will read this file and create the service automatically.
#
# Or do it manually as a "Web Service":
#   - Runtime:        Node
#   - Build Command:  npm install -g pnpm@10 && pnpm install --frozen-lockfile=false && pnpm --filter @workspace/api-server run build
#   - Start Command:  node --enable-source-maps artifacts/api-server/dist/index.mjs
#   - Health check:   /api/healthz
#
# The free tier supports yt-dlp out of the box (Python is preinstalled).

services:
  - type: web
    name: grabit-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    rootDir: .
    buildCommand: npm install -g pnpm@10 && pnpm install --frozen-lockfile=false && pnpm --filter @workspace/api-server run build
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
